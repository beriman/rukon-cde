name: Production baseline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck API
        run: npm exec --workspace apps/api tsc -- --project tsconfig.build.json --noEmit
      - name: Typecheck web
        run: npm exec --workspace apps/web tsc -- --noEmit
      - name: Unit tests
        run: npm run test -- --only
      - name: Production build
        run: npm run build
