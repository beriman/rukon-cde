version: '3.8'

services:
  # PostgreSQL Database (for local development)
  postgres:
    image: postgres:15-alpine
    container_name: rukon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rukon_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rukon-api
    depends_on:
      postgres:
        condition: service_healthy
      bitl-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rukon_dev
      - JWT_SECRET=dev-secret-key-change-in-production
      - PORT=3001
      - BITL_SERVICE_URL=http://bitl-service:8000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run start:dev

  # BITL Service (Python Microservice)
  bitl-service:
    build:
      context: apps/bitl-service
      dockerfile: Dockerfile
    container_name: rukon-bitl
    ports:
      - "8000:8000"
    volumes:
      - ./apps/bitl-service:/app
    environment:
      - ENV=development

  # Next.js Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rukon-web
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
